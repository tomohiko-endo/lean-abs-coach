<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6f2c">
  <title>Lean Abs Coach 更新</title>
  <style>
    body{margin:0;background:#f6f7f9;color:#15171a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    .card{max-width:520px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(0,0,0,.07)}
    h1{font-size:21px;margin:0 0 8px}p{font-size:14px;line-height:1.65;color:#6e737a}.status{font-weight:700;color:#15171a}
  </style>
</head>
<body>
  <div class="card"><h1>Lean Abs Coach を更新中</h1><p id="status" class="status">古いPWAキャッシュを削除しています…</p><p>トレーニング・体組成の記録はローカルストレージに残し、Service Workerとキャッシュだけを更新します。</p></div>
<script>
(async()=>{
  const el=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('lean-abs-coach')).map(k=>caches.delete(k)));
    }
    el.textContent='更新準備が完了しました。最新版を開きます…';
    setTimeout(()=>location.replace('./?_appv=6.6.0&_refresh='+Date.now()),400);
  }catch(e){
    el.textContent='自動更新に失敗しました。Safariでこのページを再読み込みしてください。';
  }
})();
</script>
</body>
</html>
